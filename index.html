<meta name="theme-color" content="#5B21B6">
<script>
/* apply the saved theme before first paint, so there's no flash of the default colours */
(function(){ try {
  var m = {"violet":"#5B21B6","sunset":"#B0124A","lagoon":"#13307A","emerald":"#053D2F","berry":"#5B0F55","night":"#0D0B1E"}, t = localStorage.getItem("nhs-budget:theme");
  if (!m[t]) t = "violet";
  document.documentElement.setAttribute("data-theme", t);
  var mt = document.querySelector('meta[name="theme-color"]'); if (mt) mt.setAttribute("content", m[t]);
} catch(e){} })();
</script>

[data-theme="night"] {
  color-scheme: dark; --bg: #0D0B1E; --glow-1: 44,24,98; --glow-2: 8,62,84; --card: #1A1631; --ink: #ECE8FB;
  --title: #F4F1FF; --accent: #A993FF; --hero-1: #221A5E; --hero-2: #5A23B8; --hero-3: #C02C86; --hero-glow: 34,211,238;
  --hero-shadow: 0,0,0; --hero-pill: rgba(255,255,255,.08); --ring-ok: #4CF5C4; --ring-low: #FFD84D;
  --ring-neg: #FF7A9A; --hero-neg-ink: #FFC9B8; --pos: #43E0A0; --neg: #FF6F8E; --warn: #F5B84A; --hot: #FF9A5C;
  --in-1: #5EF0BE; --in-2: #22C58B; --out-1: #FFA3B5; --out-2: #F0476C; --on-pos: #06281B; --shadow: 0,0,0;

}
:root, [data-theme] {
  --ink-2: color-mix(in srgb, var(--ink) 74%, var(--card));
  --ink-3: color-mix(in srgb, var(--ink) 58%, var(--card));
  --ink-4: color-mix(in srgb, var(--ink) 44%, var(--card));
  --fill-1: color-mix(in srgb, var(--ink) 4%, var(--card));
  --fill-2: color-mix(in srgb, var(--ink) 7.5%, var(--card));
  --line: color-mix(in srgb, var(--ink) 10%, var(--card));
  --line-2: color-mix(in srgb, var(--ink) 19%, var(--card));
  --accent-soft: color-mix(in srgb, var(--accent) 8%, var(--card));
  --accent-soft-2: color-mix(in srgb, var(--accent) 15%, var(--card));
  --accent-line: color-mix(in srgb, var(--accent) 30%, var(--card));
  --accent-ink: color-mix(in srgb, var(--accent) 85%, var(--ink));
  --pos-soft: color-mix(in srgb, var(--pos) 14%, var(--card));
  --pos-soft-2: color-mix(in srgb, var(--pos) 24%, var(--card));
  --neg-soft: color-mix(in srgb, var(--neg) 12%, var(--card));
  --warn-soft: color-mix(in srgb, var(--warn) 13%, var(--card));
  --warn-ink: color-mix(in srgb, var(--warn) 72%, var(--ink));
  --hot-soft: color-mix(in srgb, var(--hot) 14%, var(--card));
}
/* very old browsers without color-mix(): fall back to the Violet look */
@supports not (color: color-mix(in srgb, red 50%, blue)) {
  :root, [data-theme] { --ink-2:#58546C; --ink-3:#7D798C; --ink-4:#9C99A7; --fill-1:#F8F7FA; --fill-2:#F0EFF3; --line:#E9E8EC;
    --line-2:#D6D4DC; --accent-soft:#F4EFFE; --accent-soft-2:#EBE1FC; --accent-line:#D8C4FA; --accent-ink:#6E35D2;
    --pos-soft:#DCF3EC; --pos-soft-2:#C2EBDF; --neg-soft:#FCE4EA; --warn-soft:#F6EEE0; --warn-ink:#8A5E1C; --hot-soft:#F8E4DA; }
}
/* THEMES:END */

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; background: var(--bg); }
/* on the page itself, so bottom sheets and the toast (which sit outside .pf-root) get it too */
body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
.pf-root {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  min-height: 100vh;
  background: radial-gradient(130% 62% at 50% -12%, rgb(var(--glow-1)) 0%, rgba(var(--glow-1),0) 62%),
              radial-gradient(95% 45% at 100% 102%, rgb(var(--glow-2)) 0%, rgba(var(--glow-2),0) 60%), var(--bg);
  color: var(--ink); display: flex; justify-content: center;
  padding: max(12px, env(safe-area-inset-top)) 16px calc(44px + env(safe-area-inset-bottom));
  -webkit-font-smoothing: antialiased;
}
/* keeps the iPhone clock and battery readable over light themes; zero height in a normal browser tab */
.pf-statusband { position: fixed; top: 0; left: 0; right: 0; height: env(safe-area-inset-top, 0px); z-index: 40; pointer-events: none;
  background: linear-gradient(180deg, var(--statusbar) 0%, var(--statusbar) 62%, color-mix(in srgb, var(--statusbar) 0%, transparent) 100%); }
.pf-app { width: 100%; max-width: 460px; }
.pf-splash { height: 70vh; display: flex; align-items: center; justify-content: center; }
.pf-spinner { width: 30px; height: 30px; border-radius: 50%; border: 3px solid var(--accent-soft-2); border-top-color: var(--accent); animation: pf-spin .8s linear infinite; }
@keyframes pf-spin { to { transform: rotate(360deg); } }

.pf-header { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin: 2px 4px 12px; }
.pf-eyebrow { font-size: 13px; font-weight: 650; color: var(--ink-3); }
.pf-h1 { margin: 2px 0 0; font-size: 22px; font-weight: 780; letter-spacing: -.015em; color: var(--title); }
.pf-headbtns { display: flex; gap: 8px; flex: 0 0 auto; }
.pf-gear, .pf-themebtn { width: 42px; height: 42px; border: none; border-radius: 13px; background: var(--card); color: var(--ink-2);
  display: grid; place-items: center; cursor: pointer; padding: 0;
  box-shadow: 0 0 0 1px var(--card-edge), 0 1px 2px rgba(var(--shadow),.06), 0 8px 18px -12px rgba(var(--shadow),.3); transition: transform .15s ease; }
.pf-gear:active, .pf-themebtn:active { transform: scale(.93); }
/* the theme button wears every theme's colour in its ring */
.pf-themebtn { border: 2px solid transparent;
  background: linear-gradient(var(--card), var(--card)) padding-box,
              conic-gradient(from 200deg, #FF4D7E, #FF9F1C, #FFE14D, #2EE59D, #22B8F0, #7C5CFF, #FF4D7E) border-box; }

.pf-syncbar { display: flex; margin: 0 2px 14px; }
.pf-syncchip { display: inline-flex; align-items: center; gap: 7px; padding: 8px 12px; border-radius: 999px; background: var(--card); border: 1px solid var(--line);
  color: var(--ink-2); font-size: 12px; font-weight: 650; cursor: pointer; width: 100%; justify-content: center;
  box-shadow: 0 1px 2px rgba(var(--shadow),.05); transition: transform .12s ease, background .15s ease; font-family: inherit; }
.pf-syncchip:active { transform: scale(.99); }
.pf-syncchip--ok { color: var(--pos); }
.pf-syncchip--warn { color: var(--warn); }
.pf-syncchip--go { color: var(--accent); border-color: var(--accent-line); background: var(--accent-soft); }
.pf-syncchip--muted { color: var(--ink-3); }
.pf-synctime { color: var(--ink-4); font-weight: 600; }
.pf-spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--accent-soft-2); border-top-color: var(--accent); animation: pf-spin .8s linear infinite; flex: 0 0 auto; }

.pf-hero {
  background: linear-gradient(150deg, var(--hero-1) 0%, var(--hero-2) 46%, var(--hero-3) 100%);
  border-radius: 26px; padding: 24px 20px 18px; color: #fff; text-align: center;
  box-shadow: 0 20px 46px -18px rgba(var(--hero-shadow),.6), inset 0 1px 0 rgba(255,255,255,.14);
  position: relative; overflow: hidden; animation: pf-fadeup .6s cubic-bezier(.22,1,.36,1) both;
}
.pf-hero::before { content: ""; position: absolute; top: -40%; right: -20%; width: 240px; height: 240px;
  background: radial-gradient(circle, rgba(var(--hero-glow),.36), rgba(var(--hero-glow),0) 70%); pointer-events: none; }

.pf-ringwrap { position: relative; margin: 2px auto 4px; }
.pf-ringfill { transition: stroke-dashoffset 1.15s cubic-bezier(.22,1,.36,1), stroke .45s ease; }
.pf-ringcenter { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
.pf-ringlab { font-size: 12.5px; font-weight: 600; color: rgba(255,255,255,.72); }
.pf-ringnum { font-size: 38px; font-weight: 800; letter-spacing: -.025em; font-variant-numeric: tabular-nums; line-height: 1.05; }
.pf-ringsub { font-size: 12px; color: rgba(255,255,255,.7); font-variant-numeric: tabular-nums; }

.pf-cycle { margin: 12px 4px 4px; }
.pf-cycleline { position: relative; height: 5px; border-radius: 999px; background: rgba(255,255,255,.16); }
.pf-cyclefill { position: absolute; left: 0; top: 0; height: 100%; border-radius: 999px; background: rgba(255,255,255,.55); transition: width 1.1s cubic-bezier(.22,1,.36,1); }
.pf-cycledot { position: absolute; top: 50%; width: 12px; height: 12px; border-radius: 50%; background: #fff; transform: translate(-50%,-50%);
  box-shadow: 0 0 0 4px rgba(255,255,255,.18); transition: left 1.1s cubic-bezier(.22,1,.36,1); }
.pf-cyclelabels { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; font-size: 11.5px; color: rgba(255,255,255,.68); font-variant-numeric: tabular-nums; }
.pf-cyclepay { font-weight: 650; color: #fff; }

.pf-pills { display: flex; align-items: stretch; margin-top: 16px; background: var(--hero-pill); border-radius: 15px; padding: 4px; }
.pf-pill { flex: 1; padding: 9px 6px 10px; display: flex; flex-direction: column; gap: 3px; }
.pf-pilllab { font-size: 12px; font-weight: 600; color: rgba(255,255,255,.7); }
.pf-pillval { font-size: 18px; font-weight: 750; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.pf-pilldiv { width: 1px; background: rgba(255,255,255,.14); margin: 8px 0; }

.pf-card { background: var(--card); border-radius: 22px; padding: 16px 16px 14px; margin-top: 14px;
  box-shadow: 0 0 0 1px var(--card-edge), 0 1px 2px rgba(var(--shadow),.05), 0 16px 34px -18px rgba(var(--shadow),.24); animation: pf-fadeup .6s cubic-bezier(.22,1,.36,1) both; }
.pf-cardhead { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px; }
.pf-cardtitle { margin: 0; font-size: 15px; font-weight: 780; color: var(--title); }
.pf-cardtot { font-size: 17px; font-weight: 750; font-variant-numeric: tabular-nums; letter-spacing: -.01em; color: var(--ink); }
.pf-pos { color: var(--pos); }
.pf-neg { color: var(--neg); }

.pf-subhead { display: flex; align-items: center; justify-content: space-between; margin: 6px 2px 2px; padding-top: 12px; border-top: 1px solid var(--line); }
.pf-subtitle { font-size: 13px; font-weight: 700; color: var(--ink-3); }
.pf-subtot { font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; }
.pf-count { display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--fill-2); color: var(--ink-3); font-size: 11px; font-weight: 700; margin-left: 4px; }

.pf-list { display: flex; flex-direction: column; }
.pf-exp { display: flex; align-items: center; gap: 12px; padding: 11px 6px; border-radius: 13px; cursor: pointer; transition: background .15s ease; }
.pf-exp:hover { background: var(--fill-1); }
.pf-exp:active { background: var(--fill-2); }
.pf-exp--paid { opacity: .55; }
.pf-exp--paid .pf-expname { text-decoration: line-through; text-decoration-color: var(--line-2); }

/* icon tiles: a soft two-tone wash behind a two-tone glyph */
.pf-ic { width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center; flex-shrink: 0; font-size: 20px;
  box-shadow: inset 0 1px 0 var(--tile-hi); }
.pf-ic--pos { background: linear-gradient(145deg, var(--pos-soft-2), var(--pos-soft)); }
.pf-ic--acc { background: linear-gradient(145deg, var(--accent-soft-2), var(--accent-soft)); }
.pf-ic--mute { background: var(--fill-2); box-shadow: none; }

.pf-expmid { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.pf-expname { font-size: 15px; font-weight: 600; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pf-expcat { font-size: 12.5px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pf-expamt { font-size: 15px; font-weight: 650; font-variant-numeric: tabular-nums; color: var(--ink); white-space: nowrap; }

.pf-check { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line-2); background: var(--card); margin-left: 4px;
  display: grid; place-items: center; color: var(--on-pos); cursor: pointer; flex-shrink: 0; transition: transform .15s ease, background .2s ease, border-color .2s ease; }
.pf-check:active { transform: scale(.86); }
.pf-check--on { background: linear-gradient(135deg, var(--in-1), var(--pos)); border-color: var(--pos); animation: pf-pop .3s ease; }

.pf-compbar { display: flex; gap: 2px; height: 11px; border-radius: 999px; overflow: hidden; background: var(--fill-2); margin-bottom: 10px; }
.pf-seg { height: 100%; transition: width .9s cubic-bezier(.22,1,.36,1); }
.pf-seg--empty { background: var(--line); }
.pf-expmeta { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--ink-3); margin-bottom: 6px; padding: 0 2px; }
.pf-expmeta strong { color: var(--ink); font-weight: 700; font-variant-numeric: tabular-nums; }

.pf-empty { font-size: 13px; color: var(--ink-4); text-align: center; padding: 14px 8px; line-height: 1.5; }

.pf-add { width: 100%; margin-top: 8px; padding: 12px; border: 1.5px dashed var(--line-2); border-radius: 14px; background: transparent;
  color: var(--accent); font-size: 14px; font-weight: 680; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;
  transition: background .15s ease, border-color .15s ease, transform .12s ease; font-family: inherit; }
.pf-add:hover { background: var(--accent-soft); border-color: var(--accent-line); }
.pf-add:active { transform: scale(.99); }

.pf-foot { text-align: center; font-size: 11.5px; color: var(--ink-4); margin: 18px 12px 0; line-height: 1.6; }

.pf-goals { display: flex; flex-direction: column; gap: 2px; margin-bottom: 2px; }
.pf-goal { display: flex; align-items: center; gap: 8px; }
.pf-goalrow { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; padding: 10px 6px; border-radius: 13px; cursor: pointer; transition: background .15s ease; }
.pf-goalrow:hover { background: var(--fill-1); }
.pf-goalrow:active { background: var(--fill-2); }
.pf-goalemoji { width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center; font-size: 21px; flex-shrink: 0; box-shadow: inset 0 1px 0 var(--tile-hi); }
.pf-goalmid { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
.pf-goaltop { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.pf-goalname { font-size: 15px; font-weight: 600; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pf-goalnums { font-size: 13.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; white-space: nowrap; flex-shrink: 0; }
.pf-goalnums strong { color: var(--ink); font-weight: 700; }
.pf-goalof { font-weight: 600; }
.pf-goalbar { height: 8px; border-radius: 999px; background: var(--fill-2); overflow: hidden; }
.pf-goalfill { height: 100%; border-radius: 999px; transition: width 1s cubic-bezier(.22,1,.36,1); }
.pf-goalmeta { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
